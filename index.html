<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pray the Rosary for every nation in its own language and watch the world map turn gold.">
<meta property="og:title" content="Global Holy Rosary">
<meta property="og:description" content="Pray the Rosary for every nation in its own language and watch the world map turn gold.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='17' r='12' fill='none' stroke='%23c9a227' stroke-width='3' stroke-dasharray='3 3'/%3E%3Cpath d='M18.5 28h3v3h3v3h-3v6h-3v-6h-3v-3h3z' fill='%23c9a227'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<title>Global Holy Rosary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
/* Layout: an illuminated prayer-book app — lapis map as the altar piece, gold leaf for every Rosary offered, parchment pages for the nations. */
:root{
  --bg:#efe8d8; --surface:#fbf8f1; --surface-2:#f5efe1; --ink:#16203d; --muted:#5a6181; --line:#d9ccae;
  --lapis:#1c2a5b; --sea:#1a2856; --land:#e6dbc0; --land-line:#b8a77f;
  --gold:#a87a1c; --gold-bright:#d9b44a; --gold-soft:#f2e3b3; --on-gold:#1b1405;
  --warn:#9a4b16;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --pray:"Cormorant Garamond","Noto Serif","Iowan Old Style",Georgia,"Noto Sans Arabic","Noto Sans Devanagari","Noto Sans Ethiopic",serif;
  --g1:#efd98f; --g2:#e2bd52; --g3:#cf9d28; --g4:#b5801a; --g5:#8e5d07;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1430; --surface:#131c3c; --surface-2:#18234a; --ink:#f0e7d0; --muted:#a8afc9; --line:#2b3664;
  --lapis:#0a1128; --sea:#0a1230; --land:#36416d; --land-line:#4c5788;
  --gold:#e0bb57; --gold-bright:#f0d27a; --gold-soft:#3a3320; --on-gold:#1b1405; --warn:#f0a26a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1430; --surface:#131c3c; --surface-2:#18234a; --ink:#f0e7d0; --muted:#a8afc9; --line:#2b3664;
  --lapis:#0a1128; --sea:#0a1230; --land:#36416d; --land-line:#4c5788;
  --gold:#e0bb57; --gold-bright:#f0d27a; --gold-soft:#3a3320; --on-gold:#1b1405; --warn:#f0a26a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.45rem;font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:-2px}
.tabs{margin-left:auto;display:flex;gap:4px}
.tab{background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.tab:hover{color:var(--ink)}
.bottombar{display:none}
@media (max-width:720px){
  .tabs{display:none}
  .bottombar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottombar button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--muted);cursor:pointer}
  .bottombar button[aria-current="page"]{color:var(--gold)}
  .bottombar svg{width:22px;height:22px}
  main{padding-bottom:84px}
}

.view{padding-block:22px 48px}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);opacity:.55;border:0;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:11px 20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));border-color:transparent;color:var(--on-gold);font-weight:700;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 18px -8px rgba(168,122,28,.7)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* hero + stats */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:end;margin-bottom:18px}
.hero h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:600}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{color:var(--muted);max-width:52ch;margin:.5rem 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:flex-end}
.stat{min-width:0}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;font-weight:700}
.stat span{font-size:.78rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.progress{height:6px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),var(--g4));width:0;transition:width .8s ease}
@media (max-width:720px){.hero{grid-template-columns:1fr}.stats{justify-content:flex-start}}

/* map */
.mapcard{position:relative;border-radius:18px;overflow:hidden;background:var(--sea);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent),0 18px 40px -24px rgba(10,17,40,.8)}
.mapcard::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 80px rgba(0,0,0,.35);border-radius:inherit}
#map{display:block;width:100%;height:auto}
#map .sph{fill:url(#seaGrad)}
#map path.land{fill:var(--land);stroke:var(--land-line);stroke-width:.35;cursor:pointer;transition:fill .6s ease}
#map path.land.nodata{cursor:default;fill:color-mix(in srgb,var(--land) 70%,var(--sea))}
#map path.land:hover{stroke:#fff3c4;stroke-width:.9}
#map .l1{fill:var(--g1)} #map .l2{fill:var(--g2)} #map .l3{fill:var(--g3)} #map .l4{fill:var(--g4)} #map .l5{fill:var(--g5);filter:url(#glow)}
#map circle.dot{fill:var(--land);stroke:var(--land-line);stroke-width:.6;cursor:pointer}
#map circle.dot.l1{fill:var(--g1)}#map circle.dot.l2{fill:var(--g2)}#map circle.dot.l3{fill:var(--g3)}#map circle.dot.l4{fill:var(--g4)}#map circle.dot.l5{fill:var(--g5)}
#map .flash{animation:flash 2.4s ease}
@keyframes flash{0%{fill:#fff6cf}100%{}}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.85rem;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .15s}
.tip b{font-family:var(--display);font-size:1.05rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:12px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;padding:11px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:300px;z-index:10;box-shadow:0 16px 30px -18px rgba(0,0,0,.5)}
.results button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:9px 14px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
.results button:hover,.results button:focus{background:var(--surface-2)}
.results small{color:var(--muted)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}
@media (max-width:720px){.twocol{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{font-size:1.4rem;margin-bottom:8px}
.nlist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nlist button{display:flex;justify-content:space-between;width:100%;gap:10px;background:none;border:0;padding:7px 4px;border-bottom:1px dashed var(--line);cursor:pointer;text-align:left}
.nlist button:hover span:first-child{color:var(--gold)}
.nlist .n{font-variant-numeric:tabular-nums;color:var(--muted)}

/* country */
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;margin-bottom:8px}
.back:hover{color:var(--ink)}
.chead{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end}
.chead h1{font-size:clamp(2.4rem,6vw,4rem)}
.chead .presence{color:var(--muted);margin-top:6px}
.levelchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.88rem;white-space:nowrap}
.levelchip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.intention{margin:22px 0;padding:20px 24px;border-radius:14px;background:linear-gradient(135deg,var(--gold-soft),transparent 70%);border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));font-family:var(--display);font-size:1.45rem;font-style:italic;line-height:1.35}
.intention small{display:block;font-family:var(--body);font-style:normal;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-weight:700}
.praybox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.praybox label{font-size:.85rem;color:var(--muted)}
.praybox select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);max-width:100%}
.badge{display:inline-block;font-size:.72rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.est{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.badge.par{color:var(--warn)}
.cgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;margin-top:30px}
@media (max-width:860px){.cgrid{grid-template-columns:1fr}}
.prose p{max-width:65ch;margin:0 0 1em;font-size:1.06rem}
.prose p:first-child::first-letter{font-family:var(--display);float:left;font-size:3.6rem;line-height:.82;padding:6px 8px 0 0;color:var(--gold);font-weight:700}
.sec{margin-top:30px}
.sec h2{font-size:1.9rem;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:10px;height:10px;transform:rotate(45deg);background:var(--gold);flex:none}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{font-size:1.3rem}
.card .meta{font-size:.82rem;color:var(--gold);letter-spacing:.04em;margin:2px 0 8px}
.card p{margin:0;font-size:.96rem;color:var(--ink)}
.patrons{display:flex;flex-wrap:wrap;gap:8px}
.patrons span{padding:8px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-size:1.15rem}
.patrons small{font-family:var(--body);font-size:.78rem;color:var(--muted);margin-left:6px}
.side .panel+.panel{margin-top:14px}
.empty{color:var(--muted);font-style:italic}

/* pray */
.prayhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.prayhead h1{font-size:clamp(1.7rem,4vw,2.4rem)}
.prayhead .sub{color:var(--muted);font-size:.92rem}
.prayctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.prayctl select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted);cursor:pointer}
.praylay{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.praylay{grid-template-columns:1fr}.beadwrap{max-width:220px;margin:0 auto}}
.beadwrap{position:sticky;top:84px}
#beads{width:100%;height:auto;display:block}
#beads .bd{fill:var(--surface-2);stroke:var(--land-line);stroke-width:1;transition:fill .4s ease}
#beads .bd.done{fill:var(--g3);stroke:var(--g5)}
#beads .bd.cur{fill:var(--gold-bright);stroke:var(--gold);filter:url(#beadglow)}
#beads .chain{fill:none;stroke:var(--land-line);stroke-width:1}
#beads .cross{fill:var(--surface-2);stroke:var(--land-line)}
#beads .cross.done{fill:var(--g3);stroke:var(--g5)}
#beads .cross.cur{fill:var(--gold-bright);stroke:var(--gold)}
@media (prefers-reduced-motion:no-preference){#beads .bd.cur{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.7}}
.timer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:8px;font-variant-numeric:tabular-nums}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,36px);min-height:340px;display:flex;flex-direction:column;cursor:pointer;position:relative}
.pcard .step{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pcard .step b{font-size:.74rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.pcard .step span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard .mys{margin-top:10px;font-family:var(--display);font-style:italic;font-size:1.15rem;color:var(--muted)}
.ptext{font-family:var(--pray);font-size:clamp(1.35rem,2.6vw,1.85rem);line-height:1.5;margin:18px 0 0;white-space:pre-line}
.ptext.small{font-size:clamp(1.15rem,2.1vw,1.45rem)}
.ptrans{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--display);font-size:1.12rem;line-height:1.5;color:var(--muted)}
.mtitle{font-family:var(--display);font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.15;margin-top:18px}
.mnum{font-family:var(--display);font-size:1rem;color:var(--muted);margin-top:6px}
.fallback{margin-top:14px;font-size:.88rem;color:var(--warn);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fallback button{background:none;border:1px solid currentColor;border-radius:999px;padding:2px 10px;color:inherit;cursor:pointer;font-size:.8rem}
.pnav{display:flex;gap:10px;justify-content:space-between;margin-top:16px}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:10px}

/* celebration */
.celebrate{text-align:center;max-width:640px;margin:0 auto;padding-block:16px}
.celebrate h1{font-size:clamp(2rem,5vw,3rem);margin:10px 0}
.celebrate p{color:var(--muted)}
.minimap{margin:22px auto;max-width:520px;border-radius:14px;overflow:hidden;background:var(--sea);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}
.minimap svg{display:block;width:100%;height:auto}
.minimap path{fill:var(--land);stroke:none}
.minimap path.me{fill:var(--g2);filter:url(#glow2)}
.note{padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:left;font-size:.95rem}

/* passport */
.pp-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;margin-bottom:20px}
.pp-head h1{font-size:clamp(2rem,5vw,3rem)}
@media (max-width:720px){.pp-head,.chead{grid-template-columns:1fr}}
.levelbox{display:flex;gap:18px;flex-wrap:wrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:18px 0 26px}
.bg{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:var(--surface);opacity:.55}
.bg.got{opacity:1;border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:linear-gradient(180deg,var(--gold-soft),var(--surface))}
.bg svg{width:40px;height:40px;display:block;margin:0 auto 6px}
.bg b{display:block;font-family:var(--display);font-size:1.12rem}
.bg small{color:var(--muted);font-size:.78rem}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.stamp{border:1px dashed var(--line);border-radius:10px;padding:8px;font-size:.8rem;line-height:1.25;background:none;cursor:pointer;text-align:left;color:var(--muted);min-height:54px;display:flex;flex-direction:column;justify-content:space-between}
.stamp.on{border-style:solid;border-color:var(--gold);color:var(--on-gold);background:linear-gradient(160deg,var(--g1),var(--g2))}
.stamp small{font-variant-numeric:tabular-nums;opacity:.8}
.homesel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.homesel select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);max-width:240px}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.flt button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem}
.flt button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* about */
.about{max-width:760px}
.about h1{font-size:clamp(2.2rem,5vw,3.2rem);margin-bottom:12px}
.about h2{font-size:1.7rem;margin:28px 0 8px}
.about p{margin:0 0 1em}
.status-table{width:100%;border-collapse:collapse;font-size:.92rem}
.status-table td,.status-table th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.status-table th{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto;max-height:380px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-family:var(--display);font-size:1.4rem;font-style:italic}
.authwrap{position:fixed;inset:0;z-index:60;background:rgba(8,12,30,.55);display:grid;place-items:center;padding:16px}
.authbox{position:relative;width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:6px;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.authbox h2{font-size:2rem}
.authbox label{font-size:.82rem;color:var(--muted);margin-top:6px}
.authbox input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)}
.authbox .muted{color:var(--muted);margin:0}

<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
const MIN_MS = 8 * 60 * 1000;
const LEVELS = [[500,5],[100,4],[50,3],[10,2],[1,1]];
const LEVEL_NAMES = ["Awaiting prayer","First light","Kindled","Radiant","Golden","Glorious"];
const LEVEL_THRESH = [0,1,10,50,100,500];
const SETS = ["joyful","luminous","sorrowful","glorious"];
const SET_EN = {joyful:"Joyful Mysteries",luminous:"Luminous Mysteries",sorrowful:"Sorrowful Mysteries",glorious:"Glorious Mysteries"};
const DAY_SET = ["glorious","joyful","sorrowful","glorious","luminous","sorrowful","joyful"]; // Sun..Sat
const PRAYER_EN = {signOfCross:"Sign of the Cross",apostlesCreed:"Apostles’ Creed",ourFather:"Our Father",hailMary:"Hail Mary",gloryBe:"Glory Be",fatimaPrayer:"Fatima Prayer",hailHolyQueen:"Hail, Holy Queen",closingPrayer:"Closing Prayer"};
const STATUS = {established:["Established text","est"],verify:["Awaiting verification by native speakers",""],partial:["Partially translated","par"]};
const ORD = ["First","Second","Third","Fourth","Fifth"];

const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (v==null||v===false) continue; if (k==="class") e.className=v; else if (k==="text") e.textContent=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?"":v); } for (const k of kids.flat()) if (k!=null) e.append(k.nodeType?k:document.createTextNode(k)); return e; };
const levelOf = n => { for (const [t,l] of LEVELS) if (n>=t) return l; return 0; };
const fmt = n => new Intl.NumberFormat().format(n);
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch{ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} } };
let toastT; const toast = msg => { const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200); };

const S = {
  C:[], by:{}, L:{}, map:null, totals:{}, pilgrims:0,
  db:null, user:null, uid:null, canWrite:true, meName:"",
  me: { home:null, counts:{}, langs:{}, total:0, days:[] },
  view:"map", country:null, pray:null, flash:null
};

/* ---------- data ---------- */
async function load(){
  const [c,l,m] = await Promise.all(["data/countries.json","data/languages.json","data/map.json"].map(u=>fetch(u).then(r=>r.json())));
  S.C = c.sort((a,b)=>a.name.localeCompare(b.name)); for (const x of S.C) S.by[x.iso2]=x;
  for (const x of l) S.L[x.code]=x; S.map=m;
  const local = store.get("ghr.me", null); if (local) S.me = Object.assign(S.me, local);
  recomputeTotalsLocal();
  route();
  initCapabilities();
}
function recomputeTotalsLocal(){ if (S.sb) return; S.totals = Object.assign({}, S.me.counts); S.pilgrims = S.me.total?1:0; }

/* ---------- backend (Supabase) ---------- */
const SB_URL = "https://zxuosiojemojbzvjizxd.supabase.co";
const SB_KEY = "sb_publishable_XgUFzK2RFtVR7CFrVdGzNw_9YZf-vEW";
async function initCapabilities(){
  if (!window.supabase?.createClient) { rerender(); return; }
  S.sb = window.supabase.createClient(SB_URL, SB_KEY);
  S.sb.auth.onAuthStateChange((_e, session) => { const id = session?.user?.id || null; if (id !== S.uid){ S.uid = id; loadMine().then(()=>rerender()); } paintAccount(); });
  const { data } = await S.sb.auth.getSession(); S.uid = data.session?.user?.id || null;
  await Promise.all([loadTotals(), loadMine()]);
  paintAccount(); rerender();
  setInterval(()=>{ if (document.visibilityState==="visible") loadTotals().then(()=>rerender(true)); }, 60000);
}
async function loadTotals(){
  try {
    const [t, g] = await Promise.all([S.sb.rpc("country_totals"), S.sb.rpc("global_stats")]);
    if (!t.error){ const m={}; for (const r of t.data||[]) if (S.by[r.iso2]) m[r.iso2]=Number(r.rosary_count)||0; S.totals=m; }
    if (!g.error && g.data && g.data[0]) S.pilgrims = Number(g.data[0].pilgrims)||0;
  } catch {}
}
async function loadMine(){
  if (!S.sb || !S.uid){ S.meName=""; return; }
  try {
    const [r, p] = await Promise.all([
      S.sb.from("rosaries").select("country_iso2,language_code,completed_at").eq("user_id",S.uid).limit(5000),
      S.sb.from("profiles").select("display_name,home_country").eq("id",S.uid).maybeSingle()
    ]);
    const me = { home:null, counts:{}, langs:{}, total:0, days:[] };
    for (const x of r.data||[]){ me.counts[x.country_iso2]=(me.counts[x.country_iso2]||0)+1; me.langs[x.language_code]=(me.langs[x.language_code]||0)+1; me.total++; const d=new Date(x.completed_at); const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); if (!me.days.includes(k)) me.days.push(k); }
    if (p.data){ me.home=p.data.home_country||null; S.meName=p.data.display_name||""; }
    S.me = me;
  } catch {}
}
async function saveMe(){
  store.set("ghr.me", S.me);
  if (!S.sb || !S.uid) return false;
  const { error } = await S.sb.from("profiles").update({ home_country:S.me.home }).eq("id",S.uid);
  return !error;
}
async function saveRosary(P, completedAt){
  if (!S.sb || !S.uid) return { ok:false, reason:"signedout" };
  const { error } = await S.sb.from("rosaries").insert({ user_id:S.uid, country_iso2:P.iso, language_code:P.lang, mystery_set:P.set, started_at:new Date(P.started).toISOString(), completed_at:new Date(completedAt).toISOString() });
  if (error) return { ok:false, reason:error.message };
  await loadTotals(); return { ok:true };
}

/* ---------- account ---------- */
function paintAccount(){
  const b = $("#account-btn"); if (!b) return;
  b.textContent = S.uid ? (S.meName ? S.meName.split(" ")[0] : "My account") : "Sign in";
}
function openAuth(reason){
  const dlg = $("#auth"); $("#auth-reason").textContent = reason || "Sign in to let your Rosaries turn the map gold and keep your Pilgrim’s Passport.";
  $("#auth-msg").textContent = ""; dlg.hidden = false; $("#auth-email").focus();
}
function closeAuth(){ $("#auth").hidden = true; }
async function authSubmit(mode){
  const email=$("#auth-email").value.trim(), pw=$("#auth-pw").value, name=$("#auth-name").value.trim(), msg=$("#auth-msg");
  if (!S.sb){ msg.textContent="The prayer map can’t be reached right now. Please try again later."; return; }
  if (!email || pw.length<6){ msg.textContent="Enter your email and a password of at least 6 characters."; return; }
  msg.textContent = mode==="up" ? "Creating your account…" : "Signing in…";
  if (mode==="up"){
    const { data, error } = await S.sb.auth.signUp({ email, password:pw, options:{ data:{ display_name:name||undefined }, emailRedirectTo: location.href.split("#")[0] } });
    if (error){ msg.textContent = error.message; return; }
    if (!data.session){ msg.textContent = "Almost there. Open the email we sent you and confirm your address, then sign in here."; return; }
  } else {
    const { error } = await S.sb.auth.signInWithPassword({ email, password:pw });
    if (error){ msg.textContent = error.message==="Invalid login credentials" ? "That email and password don’t match an account." : error.message; return; }
  }
  closeAuth(); S.pendingPray=null; toast("Welcome, pilgrim."); if (S.afterAuth){ const f=S.afterAuth; S.afterAuth=null; f(); }
}
async function signOut(){ if (S.sb) await S.sb.auth.signOut(); S.uid=null; S.me={ home:null, counts:{}, langs:{}, total:0, days:[] }; toast("Signed out."); go("map"); }

/* ---------- routing ---------- */
function go(view, opts={}){ S.view=view; if (opts.country) S.country=opts.country; route(); window.scrollTo({top:0,behavior:"instant"}); }
function route(){
  document.querySelectorAll("[data-go]").forEach(b => { const v=b.dataset.go; if (b.classList.contains("brand")) return; b.toggleAttribute("aria-current", v===S.view || (v==="map" && S.view==="country")); if (b.hasAttribute("aria-current")) b.setAttribute("aria-current","page"); });
  const app = $("#app"); app.replaceChildren();
  const v = { map:viewMap, country:viewCountry, pray:viewPray, passport:viewPassport, about:viewAbout, done:viewDone }[S.view] || viewMap;
  app.append(v());
}
function rerender(soft){
  if (S.view==="pray") { updateHeaderOnly(); return; }
  if (soft && S.view==="map") { paintMap(); paintStats(); paintLists(); return; }
  const y = window.scrollY; route(); window.scrollTo({top:y,behavior:"instant"});
}
function updateHeaderOnly(){}
document.addEventListener("click", e => { const b=e.target.closest("[data-go]"); if (!b) return; const v=b.dataset.go; if (v==="pray" && !S.pray) { const iso = S.country || S.me.home || neediest(); return startPray(iso); } go(v); });

/* ---------- helpers ---------- */
const totalAll = () => Object.values(S.totals).reduce((a,b)=>a+b,0);
const golden = () => Object.keys(S.totals).filter(k=>S.totals[k]>0).length;
function neediest(){ const zero = S.C.filter(c=>!(S.totals[c.iso2]>0)); const pool = zero.length?zero:[...S.C].sort((a,b)=>(S.totals[a.iso2]||0)-(S.totals[b.iso2]||0)).slice(0,20); return pool[Math.floor(Math.random()*pool.length)].iso2; }
function langOptions(c){ const codes=[...c.languages]; for (const x of ["en","la"]) if (!codes.includes(x)) codes.push(x); return codes.filter(k=>S.L[k]); }
function langLabel(code){ const l=S.L[code]; if (!l) return code; return l.nativeName && l.nativeName!==l.name ? `${l.nativeName} · ${l.name}` : l.name; }
function statusBadge(code){ const l=S.L[code]; const s=STATUS[l?.status]||STATUS.verify; return el("span",{class:"badge "+s[1],text:s[0]}); }
function levelSwatch(lv){ return lv?`var(--g${lv})`:"var(--land)"; }

/* ---------- map view ---------- */
let mapRefs = null;
function buildMapSvg(){
  const m = S.map; const NS="http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS,"svg"); svg.id="map"; svg.setAttribute("viewBox",`0 0 ${m.w} ${m.h}`); svg.setAttribute("role","img"); svg.setAttribute("aria-label","World map. Nations turn gold as Rosaries are prayed for them.");
  svg.innerHTML = `<defs><radialGradient id="seaGrad" cx="50%" cy="45%" r="70%"><stop offset="0" style="stop-color:color-mix(in srgb, var(--sea) 78%, #4a63b0)"/><stop offset="1" style="stop-color:var(--sea)"/></radialGradient><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path class="sph" d="${m.sphere}"/>`;
  const g = document.createElementNS(NS,"g"); svg.append(g);
  const refs = {};
  for (const s of m.shapes){ const p=document.createElementNS(NS,"path"); p.setAttribute("d",s.d); p.setAttribute("class","land"+(s.k?"":" nodata")); if (s.k){ p.dataset.k=s.k; (refs[s.k] ||= []).push(p); } g.append(p); }
  for (const d of m.dots){ const c=document.createElementNS(NS,"circle"); c.setAttribute("cx",d.x); c.setAttribute("cy",d.y); c.setAttribute("r",2.6); c.setAttribute("class","dot"); c.dataset.k=d.k; (refs[d.k] ||= []).push(c); g.append(c); }
  mapRefs = refs; return svg;
}
function paintMap(){
  if (!mapRefs) return;
  for (const [k,list] of Object.entries(mapRefs)){ const lv=levelOf(S.totals[k]||0); for (const p of list){ const base=p.tagName==="circle"?"dot":"land"; p.setAttribute("class",base+(lv?" l"+lv:"")+(S.flash===k?" flash":"")); } }
  S.flash=null;
}
let statsEls = {};
function paintStats(){ if (!statsEls.g) return; const g=golden(); statsEls.g.textContent=g; statsEls.t.textContent=fmt(totalAll()); statsEls.p.textContent=fmt(S.pilgrims); statsEls.bar.style.width=(g/S.C.length*100).toFixed(1)+"%"; }
let listEls = {};
function paintLists(){
  if (!listEls.top) return;
  const top = Object.entries(S.totals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,8);
  listEls.top.replaceChildren(...(top.length?top.map(([k,v])=>el("li",{},el("button",{onclick:()=>go("country",{country:k})},el("span",{text:S.by[k].name}),el("span",{class:"n",text:fmt(v)+(v===1?" Rosary":" Rosaries")})))):[el("li",{class:"empty",text:"No Rosaries yet. The first gold on the map can be yours."})]));
  const waiting = S.C.filter(c=>!(S.totals[c.iso2]>0));
  const pick = waiting.slice().sort((a,b)=>a.name.localeCompare(b.name)); const seed = new Date().getDate();
  const shown = []; for (let i=0;i<Math.min(8,pick.length);i++) shown.push(pick[(seed*7+i*23)%pick.length]);
  listEls.wait.replaceChildren(...[...new Set(shown)].map(c=>el("li",{},el("button",{onclick:()=>go("country",{country:c.iso2})},el("span",{text:c.name}),el("span",{class:"n",text:"waiting"})))));
  listEls.waitN.textContent = `${waiting.length} of ${S.C.length} nations are still waiting for their first Rosary.`;
}
function viewMap(){
  const g=golden();
  const wrap = el("section",{class:"view"});
  statsEls = { g:el("b",{text:g}), t:el("b",{text:fmt(totalAll())}), p:el("b",{text:fmt(S.pilgrims)}), bar:el("i") };
  wrap.append(
    el("div",{class:"hero"},
      el("div",{}, el("div",{class:"eyebrow",text:"The Global Holy Rosary Challenge"}), el("h1",{},"Pray for every nation, ", el("em",{text:"in its own tongue"}), "."), el("p",{text:"Choose a country, pray the Rosary in its language, and watch it turn to gold. 197 nations, 104 languages, one prayer for peace."})),
      el("div",{}, el("div",{class:"stats"},
        el("div",{class:"stat"},statsEls.g,el("span",{text:"of 197 nations golden"})),
        el("div",{class:"stat"},statsEls.t,el("span",{text:"Rosaries offered"})),
        el("div",{class:"stat"},statsEls.p,el("span",{text:"pilgrims"}))),
        el("div",{class:"progress","aria-hidden":"true"},statsEls.bar))
    )
  );
  const card = el("div",{class:"mapcard"}); const svg = buildMapSvg(); const tip = el("div",{class:"tip"});
  card.append(svg,tip);
  svg.addEventListener("mousemove", e => { const t=e.target.closest("[data-k]"); if (!t){ tip.style.opacity=0; return; } const k=t.dataset.k, c=S.by[k]; const n=S.totals[k]||0; const r=card.getBoundingClientRect(); tip.style.left=(e.clientX-r.left)+"px"; tip.style.top=(e.clientY-r.top)+"px"; tip.replaceChildren(el("b",{text:c.name}), el("br"), (n? fmt(n)+(n===1?" Rosary":" Rosaries") : "Waiting for its first Rosary")); tip.style.opacity=1; });
  svg.addEventListener("mouseleave", ()=>tip.style.opacity=0);
  svg.addEventListener("click", e => { const t=e.target.closest("[data-k]"); if (t) go("country",{country:t.dataset.k}); });
  wrap.append(card);
  wrap.append(el("div",{class:"legend"}, ...[0,1,2,3,4,5].map(l=>el("span",{},el("i",{style:`background:${levelSwatch(l)}`}), `${LEVEL_NAMES[l]}${l?` (${LEVEL_THRESH[l]}+)`:""}`))));
  const input = el("input",{id:"country-search",type:"search",placeholder:"Find a nation (including the smallest)…","aria-label":"Find a nation",autocomplete:"off"});
  const res = el("div",{class:"results",hidden:true});
  input.addEventListener("input", () => { const q=input.value.trim().toLowerCase(); if (!q){ res.hidden=true; return; } const hits=S.C.filter(c=>c.name.toLowerCase().includes(q)).slice(0,12); res.replaceChildren(...(hits.length?hits.map(c=>el("button",{onclick:()=>go("country",{country:c.iso2})},el("span",{text:c.name}),el("small",{text:(S.totals[c.iso2]||0)?fmt(S.totals[c.iso2])+" ✦":"waiting"}))):[el("div",{style:"padding:10px 14px",class:"empty",text:"No nation by that name."})])); res.hidden=false; });
  input.addEventListener("keydown", e => { if (e.key==="Enter"){ const b=res.querySelector("button"); if (b) b.click(); } });
  wrap.append(el("div",{class:"actions"},
    el("div",{class:"search"},input,res),
    el("button",{class:"btn gold",onclick:()=>go("country",{country:neediest()})}, "✝ Pray for a nation that needs it"),
    S.me.home ? el("button",{class:"btn",onclick:()=>go("country",{country:S.me.home}),text:"My home nation: "+S.by[S.me.home].name}) : null
  ));
  listEls = { top:el("ul",{class:"nlist"}), wait:el("ul",{class:"nlist"}), waitN:el("p",{class:"empty",style:"margin:0 0 8px"}) };
  wrap.append(el("div",{class:"twocol"},
    el("div",{class:"panel"},el("h3",{text:"Most prayed for"}),listEls.top),
    el("div",{class:"panel"},el("h3",{text:"Waiting for their first Rosary"}),listEls.waitN,listEls.wait)
  ));
  if (!S.uid) wrap.append(el("p",{class:"empty",style:"margin-top:18px;font-size:.88rem"},"Sign in so your Rosaries turn the shared world map gold. ",el("button",{class:"btn ghost",style:"padding:4px 12px",onclick:()=>openAuth(),text:"Sign in or create an account"})));
  requestAnimationFrame(()=>{ paintMap(); paintStats(); paintLists(); });
  return wrap;
}

/* ---------- country view ---------- */
function viewCountry(){
  const c = S.by[S.country] || S.C[0]; const n=S.totals[c.iso2]||0; const lv=levelOf(n); const mine=S.me.counts[c.iso2]||0;
  const wrap = el("article",{class:"view"});
  wrap.append(el("button",{class:"back",onclick:()=>go("map"),text:"← Back to the map"}));
  wrap.append(el("div",{class:"chead"},

/* ---------- rosary engine ---------- */
function buildSteps(){
  const s=[]; const P=(p,b,extra={})=>s.push({kind:"prayer",p,b,...extra});
  P("signOfCross","cross"); P("apostlesCreed","cross"); P("ourFather","P0");
  ["for an increase of faith","for an increase of hope","for an increase of charity"].forEach((n,i)=>P("hailMary","P"+(i+1),{note:n,count:[i+1,3]}));
  P("gloryBe","P4");
  for (let d=0; d<5; d++){
    const big = d===0?"P4":"L"+d;
    s.push({kind:"mystery",d,b:big});
    P("ourFather",big,{d});
    for (let i=0;i<10;i++) P("hailMary",`D${d}-${i}`,{d,count:[i+1,10]});
    P("gloryBe",`D${d}-9`,{d}); P("fatimaPrayer",`D${d}-9`,{d});
  }
  P("hailHolyQueen","medal"); P("closingPrayer","medal"); P("signOfCross","cross",{final:true});

}

  let html = defs + `<circle class="chain" cx="${cx}" cy="${cy}" r="${r}"/><path class="chain" d="M120 ${cy+r} V 336"/>`;
